<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LKW Navi 40t – v1.5</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href="./manifest.webmanifest">
<style>
html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));background:#fff;padding:15px;border-radius:18px;box-shadow:0 3px 18px #0003;max-width:720px;margin:auto}
h1{font-size:23px;margin:0 0 6px}.profile{color:#555;margin-bottom:10px}
input{box-sizing:border-box;width:100%;font-size:18px;padding:13px;border:1px solid #bbb;border-radius:12px}
.row{display:flex;gap:8px;margin-top:9px}.row button{flex:1}
button{border:0;border-radius:12px;padding:13px 10px;font-size:17px;font-weight:700;background:#111;color:#fff}
button.secondary{background:#e9edf2;color:#1475e8}button:disabled{opacity:.4}
#status,#summary{margin-top:10px;font-size:15px}#summary{max-height:180px;overflow:auto}
#drive{display:none;position:fixed;z-index:1400;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));background:#fff;border-radius:18px;padding:13px;box-shadow:0 3px 18px #0003}
#next{font-size:21px;font-weight:800}#dist{font-size:16px;margin-top:3px}.driveBtns{display:flex;gap:8px;margin-top:9px}.driveBtns button{flex:1}
.ok{color:#187b35}.warn{color:#a45b00}.bad{color:#b00020}
</style></head>
<body>
<div id="map"></div>
<div class="panel">
<h1>🚛 LKW NAVI <small>v1.5</small></h1>
<div class="profile">40 t · 4,00 m · 2,55 m · 16,50 m</div>
<input id="dest" value="" placeholder="Zieladresse eingeben" autocomplete="street-address">
<div class="row"><button id="loc" class="secondary">📍 Standort</button><button id="route" disabled>Route berechnen</button></div>
<div class="row"><button id="start" disabled>▶ Navigation starten</button></div>
<div id="status">Standort noch nicht gesetzt.</div><div id="summary"></div>
</div>
<div id="drive"><div id="next">Navigation</div><div id="dist"></div>
<div class="driveBtns"><button id="center">🎯</button><button id="voice">🔊</button><button id="stop">⏹ Beenden</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const map=L.map('map').setView([49.75,10.2],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let startPos=null,routeCoords=[],maneuvers=[],routeLine=null,marker=null,watchId=null,navigating=false,voiceOn=true,lastSpoken=-1,userMoved=false,currentMi=0,lastFix=null;
function setStatus(t,c=''){$('status').className=c;$('status').textContent=t}
function setStart(lat,lon,acc){startPos={lat,lon};lastFix={lat,lon};if(!marker)marker=L.marker([lat,lon]).addTo(map).bindPopup('Standort');else marker.setLatLng([lat,lon]);if(!navigating)map.setView([lat,lon],15);$('route').disabled=false;setStatus('Standort gesetzt'+(acc?` (±${Math.round(acc)} m)`:'')+'.','ok')}
function getLocation(){if(!navigator.geolocation){setStatus('GPS wird nicht unterstützt.','bad');return}setStatus('Standort wird bestimmt…','warn');navigator.geolocation.getCurrentPosition(p=>setStart(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>setStatus('Standort nicht verfügbar: '+e.message,'bad'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
$('loc').onclick=getLocation;
async function geocode(q){if(!q.trim())throw Error('Bitte Zieladresse eingeben');const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error('Zielsuche HTTP '+r.status);const a=await r.json();if(!a.length)throw Error('Adresse nicht gefunden');return{lat:+a[0].lat,lon:+a[0].lon}}
function decode(str,p=6){let i=0,lat=0,lng=0,o=[],f=10**p;while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}
async function calculate(){if(!startPos)return;$('route').disabled=true;$('start').disabled=true;setStatus('LKW-Route wird berechnet…','warn');try{const d=await geocode($('dest').value);const body={locations:[{lat:startPos.lat,lon:startPos.lon},{lat:d.lat,lon:d.lon}],costing:'truck',costing_options:{truck:{height:4,width:2.55,length:16.5,weight:40,top_speed:85}},units:'kilometers',language:'de-DE',directions_options:{units:'kilometers'}};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('Routing HTTP '+r.status);const data=await r.json(),leg=data.trip.legs[0];routeCoords=decode(leg.shape,6);maneuvers=leg.maneuvers||[];currentMi=0;lastSpoken=-1;if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routeCoords,{weight:6}).addTo(map);map.fitBounds(routeLine.getBounds(),{padding:[30,30]});const km=data.trip.summary.length,serverMin=data.trip.summary.time/60,min=Math.max(Math.round(serverMin),Math.ceil(km/85*60));const eta=new Date(Date.now()+min*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('summary').innerHTML=`<b>🟢 Route: ${km.toFixed(1)} km</b><br><b>⏱ Noch ca. ${Math.floor(min/60)} h ${String(min%60).padStart(2,'0')} min · Ankunft ca. ${eta} Uhr</b><br>🚛 LKW-Zeitprofil: max. 85 km/h<br>40-t-Profil an Routing übergeben. Verkehrszeichen vor Ort haben Vorrang.`;setStatus('Route bereit.','ok');$('start').disabled=false}catch(e){setStatus('Fehler: '+e.message,'bad')}finally{$('route').disabled=false}}
$('route').onclick=calculate;
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)*p/2);return R*Math.sqrt(x*x+y*y)}
function nearestIndex(lat,lon){let best=0,bd=Infinity;for(let i=0;i<routeCoords.length;i++){const d=hav(lat,lon,routeCoords[i][0],routeCoords[i][1]);if(d<bd){bd=d;best=i}}return[best,bd]}
function speak(t,key){if(!voiceOn||key===lastSpoken||!t||!('speechSynthesis'in window))return;lastSpoken=key;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';speechSynthesis.speak(u)}
function updateNav(p){const lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy;lastFix={lat,lon};startPos={lat,lon};if(marker)marker.setLatLng([lat,lon]);else marker=L.marker([lat,lon]).addTo(map);const[idx,off]=nearestIndex(lat,lon);while(currentMi+1<maneuvers.length && idx>=(maneuvers[currentMi+1].begin_shape_index??Infinity))currentMi++;while(currentMi>0 && idx<(maneuvers[currentMi].begin_shape_index??0)-3)currentMi--;let nextMi=Math.min(currentMi+1,maneuvers.length-1),m=maneuvers[currentMi]||{},targetIndex=maneuvers[nextMi]?.begin_shape_index??routeCoords.length-1,target=routeCoords[Math.min(targetIndex,routeCoords.length-1)],meters=target?hav(lat,lon,target[0],target[1]):0;$('next').textContent=(maneuvers[nextMi]?.instruction||m.instruction||'Route folgen');$('dist').textContent=(meters>1000?(meters/1000).toFixed(1)+' km':Math.round(meters)+' m')+(off>120?' · ⚠️ Route verlassen':'')+(acc>80?' · GPS ±'+Math.round(acc)+' m':'');if(meters<350)speak(maneuvers[nextMi]?.verbal_pre_transition_instruction||maneuvers[nextMi]?.instruction,nextMi);if(!userMoved){map.setView([lat,lon],16,{animate:true});if(Number.isFinite(p.coords.heading)&&p.coords.speed>2){/* Leaflet map stays north-up for stability */}}}
function startNav(){if(!routeCoords.length){setStatus('Erst Route berechnen.','bad');return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);navigating=true;userMoved=false;$('drive').style.display='block';setStatus('Navigation läuft – GPS wird fortlaufend verfolgt.','ok');watchId=navigator.geolocation.watchPosition(updateNav,e=>setStatus('GPS-Fehler: '+e.message,'bad'),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
$('start').onclick=startNav;map.on('dragstart zoomstart',()=>{if(navigating)userMoved=true});
$('center').onclick=()=>{userMoved=false;if(lastFix)map.setView([lastFix.lat,lastFix.lon],16)};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊':'🔇';if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('stop').onclick=()=>{navigating=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;$('drive').style.display='none';if('speechSynthesis'in window)speechSynthesis.cancel();setStatus('Navigation beendet.','')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
setTimeout(()=>$('dest').focus(),300);
</script></body></html>
