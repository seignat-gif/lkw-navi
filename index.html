<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LKW Navi 40t – v4.4</title>
<link rel="manifest" href="./manifest.webmanifest">
<link href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>

#map{position:fixed;inset:0}
.panel{position:fixed;z-index:10;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));background:#fff;padding:15px;border-radius:18px;box-shadow:0 3px 18px #0003;max-width:720px;margin:auto}
h1{font-size:23px;margin:0 0 6px}.profile{color:#555;margin-bottom:10px}
input{box-sizing:border-box;width:100%;font-size:18px;padding:13px;border:1px solid #bbb;border-radius:12px}
.row{display:flex;gap:8px;margin-top:9px}.row button{flex:1}
button{border:0;border-radius:12px;padding:13px 10px;font-size:17px;font-weight:700;background:#111;color:#fff}
button.secondary{background:#e9edf2;color:#1475e8}button:disabled{opacity:.4}
#status,#summary{margin-top:10px;font-size:15px}#summary{max-height:180px;overflow:auto}
#drive{display:none;position:fixed;z-index:20;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 18px #0003;max-width:720px;margin:auto}
#next{font-size:20px;line-height:1.15;font-weight:800;overflow:hidden}#dist{font-size:17px;font-weight:700;margin-top:5px}
.driveBtns{position:fixed;display:flex;gap:8px;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:30}
.driveBtns button{flex:1;padding:12px 8px;box-shadow:0 3px 14px #0004}
body.driving .panel{display:none} body.driving #drive{display:block}
#vehicle{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:32px solid #111;filter:drop-shadow(0 2px 3px #fff) drop-shadow(0 2px 3px #0007)}
.ok{color:#187b35}.warn{color:#a45b00}.bad{color:#b00020}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h1>🚛 LKW NAVI <small>v4.4</small></h1>
<div class="profile">40 t · 4,00 m · 2,55 m · 16,50 m</div>
<input id="dest" value="" placeholder="Zieladresse eingeben" autocomplete="street-address">
<div class="row"><button id="loc" class="secondary">📍 Standort</button><button id="route" disabled>Route berechnen</button></div>
<div class="row"><button id="start" disabled>▶ Navigation starten</button></div>
<div id="status">Standort noch nicht gesetzt.</div><div id="summary"></div>
</div>
<div id="drive"><div id="next">Navigation</div><div id="dist"></div><div id="tripinfo" style="margin-top:6px;font-size:16px;font-weight:700"></div><div id="truckwarn" style="display:none;margin-top:8px;padding:9px;border-radius:10px;background:#fff1c7;color:#7a3e00;font-weight:800"></div>
<div class="driveBtns"><button id="center">🎯</button><button id="overview">🗺️</button><button id="voice">🔊</button><button id="stop">⏹ Beenden</button></div></div>

<script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
<script>
const $=id=>document.getElementById(id);
const style={
 version:8,
 sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},
 layers:[{id:'osm',type:'raster',source:'osm'}]
};
const map=new maplibregl.Map({container:'map',style,center:[10.2,49.75],zoom:10,attributionControl:true,pitchWithRotate:false});
let startPos=null,destPos=null,routeCoords=[],maneuvers=[],watchId=null,navigating=false,voiceOn=true,lastSpoken=-1,userMoved=false,currentMi=0,lastFix=null,lastRouteIndex=0,offRouteSince=0,rerouting=false,lastHeading=0,lastVoiceStage='',bearingReady=false,vehicleMarker=null,totalKm=0,totalSec=0;
function setStatus(t,c=''){$('status').className=c;$('status').textContent=t}
function smoothHeading(next){
 if(!Number.isFinite(next))return lastHeading;
 if(!bearingReady){bearingReady=true;lastHeading=next;return next}
 let d=((next-lastHeading+540)%360)-180;
 lastHeading=(lastHeading+d*0.35+360)%360;return lastHeading;
}
function setMarker(lat,lon){
 if(!vehicleMarker){const el=document.createElement('div');el.id='vehicle';vehicleMarker=new maplibregl.Marker({element:el,rotationAlignment:'viewport'}).setLngLat([lon,lat]).addTo(map)}
 else vehicleMarker.setLngLat([lon,lat]);
}
function setStart(lat,lon,acc){startPos={lat,lon};lastFix={lat,lon};setMarker(lat,lon);if(!navigating)map.jumpTo({center:[lon,lat],zoom:15,bearing:0});$('route').disabled=false;setStatus('Standort gesetzt'+(acc?` (±${Math.round(acc)} m)`:'')+'.','ok')}
function getLocation(){if(!navigator.geolocation){setStatus('GPS wird nicht unterstützt.','bad');return}setStatus('Standort wird bestimmt…','warn');navigator.geolocation.getCurrentPosition(p=>setStart(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>setStatus('Standort nicht verfügbar: '+e.message,'bad'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
$('loc').onclick=getLocation;
async function geocode(q){if(!q.trim())throw Error('Bitte Zieladresse eingeben');const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error('Zielsuche HTTP '+r.status);const a=await r.json();if(!a.length)throw Error('Adresse nicht gefunden');return{lat:+a[0].lat,lon:+a[0].lon}}
function decode(str,p=6){let i=0,lat=0,lng=0,o=[],f=10**p;while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}
function routeGeo(){return{type:'Feature',geometry:{type:'LineString',coordinates:routeCoords.map(x=>[x[1],x[0]])}}}

function routeNear(lat,lon,radius){
 for(const p of routeCoords)if(hav(lat,lon,p[0],p[1])<=radius)return true;
 return false;
}function remainingKm(idx,t){
 if(routeCoords.length<2)return 0;
 let m=hav(routeCoords[idx][0],routeCoords[idx][1],routeCoords[idx+1][0],routeCoords[idx+1][1])*(1-t);
 for(let i=idx+1;i<routeCoords.length-1;i++)m+=hav(routeCoords[i][0],routeCoords[i][1],routeCoords[i+1][0],routeCoords[i+1][1]);
 return m/1000;
}
function updateTripInfo(idx,t,speed){
 const km=remainingKm(idx,t);
 // Conservative truck ETA: use route-average estimate, but never imply >85 km/h average.
 let mins=Math.max(1,Math.ceil(km/85*60));
 if(totalKm>0&&totalSec>0){
   const serverRate=(totalSec/60)/totalKm;
   mins=Math.max(mins,Math.ceil(km*serverRate));
 }
 const eta=new Date(Date.now()+mins*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
 $('tripinfo').textContent=`Ankunft ca. ${eta} · Rest ${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')} h · ${km.toFixed(1)} km`;
}
async function rawTruckRoute(locations,avoidLocations=[]){
 const body={
   locations,
   ...(avoidLocations.length?{avoid_locations:avoidLocations}:{}),
   costing:'truck',
   costing_options:{truck:{height:4,width:2.55,length:16.5,weight:40,top_speed:85}},
   units:'kilometers',language:'de-DE',
   directions_options:{units:'kilometers'}
 };
 const res=await fetch('https://valhalla1.openstreetmap.de/route',{
   method:'POST',
   headers:{'Content-Type':'application/json','X-Client-Id':'seignat-gif-lkw-navi'},
   body:JSON.stringify(body)
 });
 if(!res.ok)throw Error('Routing HTTP '+res.status);
 return res.json();
}
async function safeTruckRoute(a,d){
 const direct=await rawTruckRoute([{lat:a.lat,lon:a.lon},{lat:d.lat,lon:d.lon}]);
 const directCoords=[];
 for(const leg of direct.trip.legs) directCoords.push(...decode(leg.shape,6));
 const r=KNOWN_TRUCK_RESTRICTIONS[0];

 // Local destination access: don't block the destination itself.
 if(destinationInsideRestriction(d,r))
   return {data:direct,restrictedDestination:true};

 if(!coordsNearRestriction(directCoords,r))
   return {data:direct,restrictedDestination:false};

 // Valhalla maps each avoid_location to the nearest road edge and excludes it.
 const avoid=[
   {lat:48.4380,lon:10.0110},
   {lat:48.4450,lon:10.0120},
   {lat:48.4520,lon:10.0100}
 ];
 try{
   const alt=await rawTruckRoute(
     [{lat:a.lat,lon:a.lon},{lat:d.lat,lon:d.lon}],
     avoid
   );
   const altCoords=[];
   for(const leg of alt.trip.legs) altCoords.push(...decode(leg.shape,6));

   // Accept only if it no longer traverses the restricted corridor.
   if(!coordsNearRestriction(altCoords,r))
     return {data:alt,autoAvoided:true,restrictedDestination:false};
 }catch(_){}

 // Never kill navigation completely: retain the truck route but warn clearly.
 return {data:direct,restrictionUnresolved:true,restrictedDestination:false};
}
function unpackTrip(data){
 const allCoords=[], allManeuvers=[];
 let shapeIndexOffset=0;
 for(const leg of data.trip.legs){
   const c=decode(leg.shape,6);
   if(allCoords.length && c.length) c.shift();
   allCoords.push(...c);
   for(const m of (leg.maneuvers||[])){
     allManeuvers.push({...m,
       begin_shape_index:(m.begin_shape_index||0)+shapeIndexOffset,
       end_shape_index:(m.end_shape_index||0)+shapeIndexOffset});
   }
   shapeIndexOffset=Math.max(0,allCoords.length-1);
 }
 return {coords:allCoords,maneuvers:allManeuvers};
}

function drawRoute(){
 const data=routeGeo();
 if(map.getSource('route'))map.getSource('route').setData(data);
 else{map.addSource('route',{type:'geojson',data});map.addLayer({id:'route-outline',type:'line',source:'route',paint:{'line-color':'#ffffff','line-width':9,'line-opacity':.85}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#1677ff','line-width':6}})}
}
function fitRoute(){
 if(!routeCoords.length)return;
 if(navigating&&lastFix){userMoved=false;updateViewFromLast();return}
 let b=new maplibregl.LngLatBounds();
 routeCoords.forEach(p=>b.extend([p[1],p[0]]));
 map.fitBounds(b,{padding:{top:260,bottom:100,left:35,right:35},bearing:0,duration:0});
}
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter'];
async function fetchWithTimeout(url,options={},ms=4500){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{return await fetch(url,{...options,signal:c.signal})}finally{clearTimeout(t)}
}
function parseLimit(v){const m=String(v??'').replace(',','.').match(/\d+(?:\.\d+)?/);return m?+m[0]:null}
function restrictionReason(t){const h=(t.hgv||'').toLowerCase(),a=(t.access||'').toLowerCase();if(h==='no'||h==='private')return 'Lkw-Verbot';if(['destination','delivery','customers'].includes(h))return 'nur Ziel-/Lieferverkehr';if((a==='no'||a==='private')&&!['yes','designated','permissive'].includes(h))return 'Zufahrt beschränkt';for(const [k,n,l] of [['maxweight',40,'Gewicht'],['maxweightrating',40,'zul. Gesamtgewicht'],['maxheight',4,'Höhe'],['maxwidth',2.55,'Breite'],['maxlength',16.5,'Länge']]){const x=parseLimit(t[k]);if(x!==null&&x<n)return `${l} max. ${t[k]}`}return null}
function sampleLine(c,n=24){if(c.length<=n)return c;let o=[],q=(c.length-1)/(n-1);for(let i=0;i<n;i++)o.push(c[Math.round(i*q)]);return o}
function pseg(p,a,b){const z=(p[0]+a[0]+b[0])/3*Math.PI/180,kx=111320*Math.cos(z),ky=110540,px=p[1]*kx,py=p[0]*ky,ax=a[1]*kx,ay=a[0]*ky,bx=b[1]*kx,by=b[0]*ky,vx=bx-ax,vy=by-ay,wx=px-ax,wy=py-ay,t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/((vx*vx+vy*vy)||1)));return Math.hypot(px-(ax+t*vx),py-(ay+t*vy))}
function touches(g,c){const r=sampleLine(c,70);for(const n of g||[])for(let i=0;i<r.length-1;i++)if(pseg([n.lat,n.lon],r[i],r[i+1])<45)return true;return false}
async function checkOsmRestrictions(c,d){const p=sampleLine(c,12),line=p.map(x=>`${x[0]},${x[1]}`).join(','),keys=['hgv','access','maxweight','maxweightrating','maxheight','maxwidth','maxlength'],q=`[out:json][timeout:18];(${keys.map(k=>`way[highway][${k}](around:70,${line});`).join('')});out tags geom;`;let j=null,lastErr='';for(const url of OVERPASS){try{const r=await fetchWithTimeout(url,{method:'POST',body:'data='+encodeURIComponent(q)},4500);if(!r.ok){lastErr='HTTP '+r.status;continue}j=await r.json();break}catch(e){lastErr=String(e&&e.message||e)}}if(!j)throw Error('OSM-Prüfung nicht erreichbar'+(lastErr?' ('+lastErr+')':''));const hits=[];for(const e of j.elements||[]){const reason=restrictionReason(e.tags||{});if(!reason||!touches(e.geometry,c))continue;if(reason==='nur Ziel-/Lieferverkehr'&&d&&(e.geometry||[]).some(n=>hav(d.lat,d.lon,n.lat,n.lon)<180))continue;hits.push({reason,name:(e.tags||{}).name||'',geom:e.geometry||[]})}return hits}
function avoidHit(h){const g=h.geom||[];if(!g.length)return null;const n=g[Math.floor(g.length/2)];return {lat:n.lat,lon:n.lon}}

async function rawTruckRoute(a,b,avoid=[]){const body={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing:'truck',costing_options:{truck:{height:4,width:2.55,length:16.5,weight:40,top_speed:85}},units:'kilometers',language:'de-DE',directions_options:{units:'kilometers'}};if(avoid.length)body.avoid_locations=avoid;const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':'seignat-gif-lkw-navi'},body:JSON.stringify(body)});if(!r.ok)throw Error('Routing '+r.status);return r.json()}
async function requestRoute(a,b){
 const data=await rawTruckRoute(a,b,[]);
 return {data};
}
async function validateAndMaybeReroute(a,b,data){
 let hits;
 try{hits=await checkOsmRestrictions(unpackTrip(data).coords,b)}
 catch(e){return {data,restrictionCheckFailed:true}}
 if(!hits.length)return {data,restrictionChecked:true};
 const p=avoidHit(hits[0]);
 if(!p)return {data,restrictionUnresolved:true,restrictionHits:hits};
 try{
  const alt=await rawTruckRoute(a,b,[p]);
  const hits2=await checkOsmRestrictions(unpackTrip(alt).coords,b);
  if(!hits2.length)return {data:alt,autoAvoided:true,restrictionChecked:true};
  return {data:alt,restrictionUnresolved:true,restrictionHits:hits2};
 }catch(e){return {data,restrictionUnresolved:true,restrictionHits:hits}}
}

async function calculate(){
 if(!startPos)return;$('route').disabled=true;$('start').disabled=true;setStatus('40-t-Route wird berechnet…','warn');
 try{
  const d=destPos||await geocode($('dest').value);destPos=d;
  const first=await requestRoute(startPos,d);let data=first.data,u=unpackTrip(data);
  routeCoords=u.coords;maneuvers=u.maneuvers;totalKm=data.trip.summary.length;totalSec=data.trip.summary.time;
  currentMi=0;lastRouteIndex=0;lastSpoken=-1;lastVoiceStage='';offRouteSince=0;drawRoute();fitRoute();
  const showSummary=()=>{
   const km=totalKm,min=Math.max(Math.round(totalSec/60),Math.ceil(km/85*60)),eta=new Date(Date.now()+min*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
   $('summary').innerHTML=`<b>🟢 Route: ${km.toFixed(1)} km</b><br><b>⏱ Noch ca. ${Math.floor(min/60)} h ${String(min%60).padStart(2,'0')} min · Ankunft ca. ${eta} Uhr</b><br>🚛 40 t · 4,00 m · 2,55 m · 16,50 m.`;
  };
  showSummary();$('truckwarn').style.display='block';$('truckwarn').textContent='🔎 Lkw-Beschränkungen werden im Hintergrund geprüft…';
  setStatus('Route bereit.','ok');$('start').disabled=false;$('route').disabled=false;

  // Do not block the usable route while public OSM services are checked.
  validateAndMaybeReroute(startPos,d,data).then(result=>{
   if(result.autoAvoided){
    data=result.data;u=unpackTrip(data);routeCoords=u.coords;maneuvers=u.maneuvers;totalKm=data.trip.summary.length;totalSec=data.trip.summary.time;
    drawRoute();if(!navigating)fitRoute();showSummary();
    $('truckwarn').style.display='block';$('truckwarn').textContent='✅ Erkannte OSM-Lkw-Beschränkung automatisch umfahren.';
   }else if(result.restrictionUnresolved){
    const h=(result.restrictionHits||[])[0];$('truckwarn').style.display='block';
    $('truckwarn').textContent='⚠️ Lkw-Beschränkung erkannt'+(h?': '+h.reason+(h.name?' – '+h.name:''):'')+'. Keine bestätigte Umfahrung gefunden.';
   }else if(result.restrictionCheckFailed){
    $('truckwarn').style.display='block';$('truckwarn').textContent='⚠️ OSM-Lkw-Prüfung derzeit nicht erreichbar. Route bleibt nutzbar; Verkehrszeichen beachten.';
   }else{
    $('truckwarn').style.display='block';$('truckwarn').textContent='✅ Keine erfasste OSM-Lkw-Beschränkung auf der Route gefunden.';
   }
  });
 }catch(e){setStatus('Fehler: '+e.message,'bad');$('route').disabled=false}
}
$('route').onclick=calculate;
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)*p/2);return R*Math.sqrt(x*x+y*y)}
function projectOnSegment(lat,lon,a,b){const p=Math.PI/180,ref=lat*p,R=6371000,x=(lon-a[1])*p*Math.cos(ref)*R,y=(lat-a[0])*p*R,vx=(b[1]-a[1])*p*Math.cos(ref)*R,vy=(b[0]-a[0])*p*R,vv=vx*vx+vy*vy,t=vv?Math.max(0,Math.min(1,(x*vx+y*vy)/vv)):0;return{d:Math.hypot(x-vx*t,y-vy*t),t}}
function pointOnSegment(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function segmentBearing(a,b){const p=Math.PI/180,y=Math.sin((b[1]-a[1])*p)*Math.cos(b[0]*p),x=Math.cos(a[0]*p)*Math.sin(b[0]*p)-Math.sin(a[0]*p)*Math.cos(b[0]*p)*Math.cos((b[1]-a[1])*p);return(Math.atan2(y,x)/p+360)%360}
function nearestProgress(lat,lon){let best={idx:0,t:0,d:Infinity},from=Math.max(0,lastRouteIndex-25),to=Math.min(routeCoords.length-2,lastRouteIndex+500);for(let i=from;i<=to;i++){const q=projectOnSegment(lat,lon,routeCoords[i],routeCoords[i+1]);if(q.d<best.d)best={idx:i,t:q.t,d:q.d}}if(best.idx+8<lastRouteIndex)best.idx=lastRouteIndex;lastRouteIndex=Math.max(lastRouteIndex,best.idx);return best}
function routeDistance(fromIdx,fromT,toIdx){if(toIdx<=fromIdx)return 0;let m=hav(routeCoords[fromIdx][0],routeCoords[fromIdx][1],routeCoords[fromIdx+1][0],routeCoords[fromIdx+1][1])*(1-fromT);for(let i=fromIdx+1;i<toIdx;i++)m+=hav(routeCoords[i][0],routeCoords[i][1],routeCoords[i+1][0],routeCoords[i+1][1]);return m}
function makeUtterance(t){const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=1;u.pitch=1;u.volume=1;const vs=speechSynthesis.getVoices(),de=vs.find(v=>/^de(-|_)/i.test(v.lang));if(de)u.voice=de;return u}
function speak(t,key,force=false){if(!voiceOn||!t||!('speechSynthesis'in window))return;if(!force&&key===lastSpoken)return;if(!force)lastSpoken=key;speechSynthesis.cancel();speechSynthesis.speak(makeUtterance(t))}
function unlockVoice(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.speak(makeUtterance('Navigation gestartet'))}
async function rerouteFrom(lat,lon){if(rerouting||!destPos)return;rerouting=true;setStatus('Route verlassen – neue LKW-Route wird berechnet…','warn');try{startPos={lat,lon};const data=await requestRoute(startPos,destPos),leg=data.trip.legs[0];routeCoords=u.coords;maneuvers=u.maneuvers;totalKm=data.trip.summary.length;totalSec=data.trip.summary.time;updateTruckWarnings();currentMi=0;lastRouteIndex=0;lastSpoken=-1;lastVoiceStage='';offRouteSince=0;drawRoute();setStatus('Neue Route aktiv.','ok')}catch(e){setStatus('Neuberechnung fehlgeschlagen: '+e.message,'bad')}finally{rerouting=false}}
function updateNav(p){
 const lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy,speed=p.coords.speed??0;lastFix={lat,lon};startPos={lat,lon};
 if(Number.isFinite(p.coords.heading)&&p.coords.heading>=0&&speed>1)smoothHeading(p.coords.heading);
 if(routeCoords.length<2){setMarker(lat,lon);return}
 const prog=nearestProgress(lat,lon),idx=prog.idx,off=prog.d;let display=[lat,lon];
 if(off<80&&routeCoords[idx+1])display=pointOnSegment(routeCoords[idx],routeCoords[idx+1],prog.t);
 const routeHead=routeCoords[idx+1]?segmentBearing(routeCoords[idx],routeCoords[idx+1]):lastHeading;
 // Prefer route geometry for stable motorway heading; GPS heading is fallback if far from route.
 const navHead=(off<80)?routeHead:(bearingReady?lastHeading:routeHead);
 setMarker(display[0],display[1]);
 if(!userMoved)map.jumpTo({center:[display[1],display[0]],zoom:16.5,bearing:navHead,pitch:0});
 while(currentMi+1<maneuvers.length&&idx>=(maneuvers[currentMi+1].begin_shape_index??Infinity)){currentMi++;lastVoiceStage=''}
 const m=maneuvers[currentMi]||{},end=m.end_shape_index??idx,remain=routeDistance(idx,prog.t,end);
