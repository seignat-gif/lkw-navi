<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LKW Navi 40t – v2.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="manifest" href="./manifest.webmanifest">
<style>
html,body,#map{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
#map{position:fixed;inset:0}.panel{position:fixed;z-index:1000;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));background:#fff;padding:15px;border-radius:18px;box-shadow:0 3px 18px #0003;max-width:720px;margin:auto}
h1{font-size:23px;margin:0 0 6px}.profile{color:#555;margin-bottom:10px}
input{box-sizing:border-box;width:100%;font-size:18px;padding:13px;border:1px solid #bbb;border-radius:12px}
.row{display:flex;gap:8px;margin-top:9px}.row button{flex:1}
button{border:0;border-radius:12px;padding:13px 10px;font-size:17px;font-weight:700;background:#111;color:#fff}
button.secondary{background:#e9edf2;color:#1475e8}button:disabled{opacity:.4}
#status,#summary{margin-top:10px;font-size:15px}#summary{max-height:180px;overflow:auto}
#drive{display:none;position:fixed;z-index:1400;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));background:#fff;border-radius:18px;padding:13px;box-shadow:0 3px 18px #0003}
#next{font-size:21px;font-weight:800}#dist{font-size:16px;margin-top:3px}.driveBtns{display:flex;gap:8px;margin-top:9px}.driveBtns button{flex:1}
.ok{color:#187b35}.warn{color:#a45b00}.bad{color:#b00020}
body.driving .panel{display:none}
body.driving #drive{
 display:block;top:max(12px,env(safe-area-inset-top));bottom:auto;
 left:12px;right:12px;padding:12px;border-radius:16px;max-width:720px;margin:auto
}
body.driving #next{font-size:20px;line-height:1.15;padding-right:4px}
body.driving #dist{font-size:17px;font-weight:700;margin-top:5px}
body.driving .driveBtns{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));margin:0;z-index:1500}
body.driving .driveBtns button{padding:12px 8px;box-shadow:0 3px 14px #0004}
.nav-arrow{width:34px;height:34px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 3px #0007)}
.nav-arrow span{display:block;font-size:34px;line-height:34px;transform-origin:50% 50%}



#navVehicle{display:none}

</style></head>
<body>
<div id="map"></div><div id="navVehicle" aria-hidden="true">▲</div>
<div class="panel">
<h1>🚛 LKW NAVI <small>v2.4</small></h1>
<div class="profile">40 t · 4,00 m · 2,55 m · 16,50 m</div>
<input id="dest" value="" placeholder="Zieladresse eingeben" autocomplete="street-address">
<div class="row"><button id="loc" class="secondary">📍 Standort</button><button id="route" disabled>Route berechnen</button></div>
<div class="row"><button id="start" disabled>▶ Navigation starten</button></div>
<div id="status">Standort noch nicht gesetzt.</div><div id="summary"></div>
</div>
<div id="drive"><div id="next">Navigation</div><div id="dist"></div>
<div class="driveBtns"><button id="center">🎯</button><button id="overview">🗺️</button><button id="voice">🔊</button><button id="stop">⏹ Beenden</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
const $=id=>document.getElementById(id);
const map=L.map('map',{rotate:true,bearing:0,rotateControl:false,touchRotate:false}).setView([49.75,10.2],10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let startPos=null,destPos=null,routeCoords=[],maneuvers=[],routeLine=null,marker=null,watchId=null,navigating=false,voiceOn=true,lastSpoken=-1,userMoved=false,currentMi=0,lastFix=null,lastRouteIndex=0,offRouteSince=0,rerouting=false,lastHeading=0,lastVoiceStage='',bearingReady=false;
function setStatus(t,c=''){$('status').className=c;$('status').textContent=t}

function setNavBearing(h){
 if(typeof map.setBearing==='function' && Number.isFinite(h)) map.setBearing(h);
}
function smoothHeading(next){
 if(!Number.isFinite(next))return lastHeading;
 if(!bearingReady){bearingReady=true;lastHeading=next;return next}
 let d=((next-lastHeading+540)%360)-180;
 lastHeading=(lastHeading+d*0.35+360)%360;
 return lastHeading;
}
function arrowIcon(h=0){return L.divIcon({className:'nav-arrow',html:`<span>▲</span>`,iconSize:[34,34],iconAnchor:[17,17]})}
function setMarker(lat,lon,h){
 if(!marker)marker=L.marker([lat,lon],{icon:arrowIcon(h)}).addTo(map);
 else{marker.setLatLng([lat,lon]);marker.setIcon(arrowIcon(h))}
}

function setStart(lat,lon,acc){startPos={lat,lon};lastFix={lat,lon};setMarker(lat,lon,lastHeading);if(!navigating)map.setView([lat,lon],15);$('route').disabled=false;setStatus('Standort gesetzt'+(acc?` (±${Math.round(acc)} m)`:'')+'.','ok')}
function getLocation(){if(!navigator.geolocation){setStatus('GPS wird nicht unterstützt.','bad');return}setStatus('Standort wird bestimmt…','warn');navigator.geolocation.getCurrentPosition(p=>setStart(p.coords.latitude,p.coords.longitude,p.coords.accuracy),e=>setStatus('Standort nicht verfügbar: '+e.message,'bad'),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
$('loc').onclick=getLocation;
async function geocode(q){if(!q.trim())throw Error('Bitte Zieladresse eingeben');const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));if(!r.ok)throw Error('Zielsuche HTTP '+r.status);const a=await r.json();if(!a.length)throw Error('Adresse nicht gefunden');return{lat:+a[0].lat,lon:+a[0].lon}}
function decode(str,p=6){let i=0,lat=0,lng=0,o=[],f=10**p;while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);o.push([lat/f,lng/f])}return o}
async function calculate(){if(!startPos)return;$('route').disabled=true;$('start').disabled=true;setStatus('LKW-Route wird berechnet…','warn');try{const d=destPos||await geocode($('dest').value);destPos=d;const body={locations:[{lat:startPos.lat,lon:startPos.lon},{lat:d.lat,lon:d.lon}],costing:'truck',costing_options:{truck:{height:4,width:2.55,length:16.5,weight:40,top_speed:85}},units:'kilometers',language:'de-DE',directions_options:{units:'kilometers'},shortest:false};const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':'seignat-gif-lkw-navi'},body:JSON.stringify(body)});if(!r.ok)throw Error('Routing HTTP '+r.status);const data=await r.json(),leg=data.trip.legs[0];routeCoords=decode(leg.shape,6);maneuvers=leg.maneuvers||[];currentMi=0;lastRouteIndex=0;lastSpoken=-1;lastVoiceStage='';offRouteSince=0;if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routeCoords,{weight:6}).addTo(map);map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[35,260],paddingBottomRight:[35,70],animate:true});const km=data.trip.summary.length,serverMin=data.trip.summary.time/60,min=Math.max(Math.round(serverMin),Math.ceil(km/85*60));const eta=new Date(Date.now()+min*60000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('summary').innerHTML=`<b>🟢 Route: ${km.toFixed(1)} km</b><br><b>⏱ Noch ca. ${Math.floor(min/60)} h ${String(min%60).padStart(2,'0')} min · Ankunft ca. ${eta} Uhr</b><br>🚛 LKW-Zeitprofil: max. 85 km/h<br>40-t-Profil an Routing übergeben. Verkehrszeichen vor Ort haben Vorrang.`;setStatus('Route bereit.','ok');$('start').disabled=false}catch(e){setStatus('Fehler: '+e.message,'bad')}finally{$('route').disabled=false}}
$('route').onclick=calculate;
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)*p/2);return R*Math.sqrt(x*x+y*y)}
function projectOnSegment(lat,lon,a,b){
 const p=Math.PI/180,ref=lat*p,R=6371000;
 const x=(lon-a[1])*p*Math.cos(ref)*R,y=(lat-a[0])*p*R;
 const vx=(b[1]-a[1])*p*Math.cos(ref)*R,vy=(b[0]-a[0])*p*R;
 const vv=vx*vx+vy*vy,t=vv?Math.max(0,Math.min(1,(x*vx+y*vy)/vv)):0;
 return {d:Math.hypot(x-vx*t,y-vy*t),t};
}
function pointOnSegment(a,b,t){
 return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
}
function segmentBearing(a,b){
 const p=Math.PI/180, y=Math.sin((b[1]-a[1])*p)*Math.cos(b[0]*p);
 const x=Math.cos(a[0]*p)*Math.sin(b[0]*p)-Math.sin(a[0]*p)*Math.cos(b[0]*p)*Math.cos((b[1]-a[1])*p);
 return (Math.atan2(y,x)/p+360)%360;
}
function nearestProgress(lat,lon){
 let best={idx:0,t:0,d:Infinity};
 const from=Math.max(0,lastRouteIndex-25),to=Math.min(routeCoords.length-2,lastRouteIndex+500);
 for(let i=from;i<=to;i++){const q=projectOnSegment(lat,lon,routeCoords[i],routeCoords[i+1]);if(q.d<best.d)best={idx:i,t:q.t,d:q.d}}
 // Avoid jumping backwards because of parallel/nearby roads.
 if(best.idx+8<lastRouteIndex)best.idx=lastRouteIndex;
 lastRouteIndex=Math.max(lastRouteIndex,best.idx);
 return best;
}
function routeDistance(fromIdx,fromT,toIdx){
 if(toIdx<=fromIdx)return 0;
 let m=hav(routeCoords[fromIdx][0],routeCoords[fromIdx][1],routeCoords[fromIdx+1][0],routeCoords[fromIdx+1][1])*(1-fromT);
 for(let i=fromIdx+1;i<toIdx;i++)m+=hav(routeCoords[i][0],routeCoords[i][1],routeCoords[i+1][0],routeCoords[i+1][1]);
 return m;
}
function makeUtterance(t){
 const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=1;u.pitch=1;u.volume=1;
 const vs=speechSynthesis.getVoices();const de=vs.find(v=>/^de(-|_)/i.test(v.lang));
 if(de)u.voice=de;return u;
}
function speak(t,key,force=false){
 if(!voiceOn||!t||!('speechSynthesis'in window))return;
 if(!force && key===lastSpoken)return;
 if(!force)lastSpoken=key;
 speechSynthesis.cancel();
 speechSynthesis.speak(makeUtterance(t));
}
function unlockVoice(){
 if(!('speechSynthesis'in window))return;
 speechSynthesis.cancel();
 const u=makeUtterance('Navigation gestartet');
 speechSynthesis.speak(u);
}
async function rerouteFrom(lat,lon){
 if(rerouting||!destPos)return;
 rerouting=true;setStatus('Route verlassen – neue LKW-Route wird berechnet…','warn');
 try{
  startPos={lat,lon};
  const body={locations:[{lat,lon},{lat:destPos.lat,lon:destPos.lon}],costing:'truck',costing_options:{truck:{height:4,width:2.55,length:16.5,weight:40,top_speed:85}},units:'kilometers',language:'de-DE',directions_options:{units:'kilometers'},shortest:false};
  const r=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json','X-Client-Id':'seignat-gif-lkw-navi'},body:JSON.stringify(body)});
  if(!r.ok)throw Error('Routing HTTP '+r.status);
  const data=await r.json(),leg=data.trip.legs[0];routeCoords=decode(leg.shape,6);maneuvers=leg.maneuvers||[];currentMi=0;lastRouteIndex=0;lastSpoken=-1;lastVoiceStage='';offRouteSince=0;
  if(routeLine)map.removeLayer(routeLine);routeLine=L.polyline(routeCoords,{weight:6}).addTo(map);
  setStatus('Neue Route aktiv. Navigation läuft.','ok');
 }catch(e){setStatus('Neuberechnung fehlgeschlagen: '+e.message,'bad')}finally{rerouting=false}
}
function updateNav(p){
 const lat=p.coords.latitude,lon=p.coords.longitude,acc=p.coords.accuracy;
 lastFix={lat,lon};startPos={lat,lon};
 if(Number.isFinite(p.coords.heading) && p.coords.heading>=0 && (p.coords.speed??0)>1) smoothHeading(p.coords.heading);

 if(routeCoords.length<2){setMarker(lat,lon,lastHeading);return}
 const prog=nearestProgress(lat,lon),idx=prog.idx,off=prog.d;
 let display=[lat,lon];
 // Visual map matching only when the GPS fix is plausibly close to our route.
 // Raw GPS is still used below for off-route detection/rerouting.
 if(off<80 && routeCoords[idx+1]) display=pointOnSegment(routeCoords[idx],routeCoords[idx+1],prog.t);
 const routeHead=routeCoords[idx+1]?segmentBearing(routeCoords[idx],routeCoords[idx+1]):lastHeading;
 const markerHead=(Number.isFinite(p.coords.heading)&&(p.coords.speed??0)>2)?lastHeading:routeHead;
 setMarker(display[0],display[1],markerHead);
 if(!userMoved)setNavBearing(markerHead);
 const oldMi=currentMi;
 while(currentMi+1<maneuvers.length && idx>=(maneuvers[currentMi+1].begin_shape_index??Infinity))currentMi++;
 if(currentMi!==oldMi)lastVoiceStage='';
 while(currentMi>0 && idx+5<(maneuvers[currentMi].begin_shape_index??0))currentMi--;
 const nextMi=Math.min(currentMi+1,maneuvers.length-1);
 const next=maneuvers[nextMi]||maneuvers[currentMi]||{};
 const targetIndex=Math.min(next.begin_shape_index??routeCoords.length-1,routeCoords.length-1);
 const meters=routeDistance(idx,prog.t,targetIndex);
 $('next').textContent=next.instruction||'Route folgen';
 $('dist').textContent=(meters>1000?(meters/1000).toFixed(1)+' km':Math.round(meters)+' m')+(off>80?' · ⚠️ Route verlassen':'')+(acc>80?' · GPS ±'+Math.round(acc)+' m':'');
 const voiceText=next.verbal_pre_transition_instruction||next.instruction;
 let stage='';
 if(meters<180)stage='near';
 else if(meters<550)stage='500';
 else if(meters<1200)stage='1000';
 if(stage && stage!==lastVoiceStage){lastVoiceStage=stage;speak(voiceText,nextMi+'-'+stage);}
 if(off>100 && acc<80){if(!offRouteSince)offRouteSince=Date.now();else if(Date.now()-offRouteSince>8000)rerouteFrom(lat,lon)}else offRouteSince=0;
 if(!userMoved){
 map.setView(display,16,{animate:false});
}
}
function startNav(){if(!routeCoords.length){setStatus('Erst Route berechnen.','bad');return}if(watchId!==null)navigator.geolocation.clearWatch(watchId);unlockVoice();navigating=true;userMoved=false;document.body.classList.add('driving');$('drive').style.display='block';setTimeout(()=>map.invalidateSize(),100);setStatus('Navigation läuft – GPS wird fortlaufend verfolgt.','ok');watchId=navigator.geolocation.watchPosition(updateNav,e=>setStatus('GPS-Fehler: '+e.message,'bad'),{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
$('start').onclick=startNav;map.on('dragstart',()=>{if(navigating)userMoved=true});
$('center').onclick=()=>{userMoved=false;setNavBearing(lastHeading);if(marker)map.setView(marker.getLatLng(),16,{animate:false});};
$('overview').onclick=()=>{userMoved=true;setNavBearing(0);if(routeLine)map.fitBounds(routeLine.getBounds(),{padding:[35,35],animate:true})};
$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'🔊':'🔇';if(voiceOn)speak('Sprachansagen aktiviert','voice-test',true);if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel()};
$('stop').onclick=()=>{navigating=false;if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;setNavBearing(0);document.body.classList.remove('driving');$('drive').style.display='none';setTimeout(()=>map.invalidateSize(),100);if('speechSynthesis'in window)speechSynthesis.cancel();setStatus('Navigation beendet.','')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
setTimeout(()=>$('dest').focus(),300);
</script></body></html>
